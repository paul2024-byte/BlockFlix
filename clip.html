<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlockFlix - Clip</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================
           CLIP PAGE
        ====================================== */

        .clip-page {

            max-width: 1000px;

            margin: auto;

            padding: 30px 15px 60px;

            text-align: center;

        }


        .clip-title {

            font-size: 38px;

            margin: 20px 0 10px;

        }


        .clip-info {

            color: #999;

            font-size: 16px;

            margin-bottom: 25px;

        }


        /* =====================================
           VIDEO AREA
        ====================================== */

        .clip-video-container {

            width: 100%;

            max-width: 605px;

            min-height: 500px;

            margin: 0 auto 25px;

            background: #000;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.55);

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

        }


        .clip-video-container iframe {

            width: 100%;

            height: 750px;

            border: none;

            display: block;

            background: #000;

        }


        /* =====================================
           LANDSCAPE FULLSCREEN
        ====================================== */

        .clip-video-container:fullscreen {

            width: 100vw;

            height: 100vh;

            max-width: none;

            min-height: 0;

            margin: 0;

            border-radius: 0;

            background: #000;

        }


        .clip-video-container:-webkit-full-screen {

            width: 100vw;

            height: 100vh;

            max-width: none;

            min-height: 0;

            margin: 0;

            border-radius: 0;

            background: #000;

        }


        .clip-video-container:fullscreen iframe {

            width: 100vw;

            height: 100vh;

        }


        .clip-video-container:-webkit-full-screen iframe {

            width: 100vw;

            height: 100vh;

        }


        /* =====================================
           BUTTONS
        ====================================== */

        .clip-buttons {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 10px;

            margin-top: 20px;

        }


        .clip-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 13px 20px;

            background: #e50914;

            color: #fff;

            text-decoration: none;

            border: none;

            border-radius: 10px;

            font-weight: bold;

            font-size: 14px;

            cursor: pointer;

        }


        .clip-button:hover {

            background: #ff1722;

        }


        .clip-button.dark {

            background: #151515;

            border: 1px solid #333;

        }


        .clip-button.dark:hover {

            background: #252525;

        }


        /* =====================================
           MESSAGE
        ====================================== */

        .clip-message {

            color: #aaa;

            line-height: 1.6;

            max-width: 650px;

            margin: 20px auto;

        }


        .clip-loading {

            color: #aaa;

            padding: 40px 20px;

            font-size: 16px;

        }


        /* =====================================
           MOBILE
        ====================================== */

        @media (max-width: 600px) {

            .clip-page {

                padding: 20px 10px 45px;

            }


            .clip-title {

                font-size: 29px;

            }


            .clip-video-container {

                max-width: 100%;

                min-height: 500px;

                border-radius: 12px;

            }


            .clip-video-container iframe {

                height: 650px;

            }


            .clip-button {

                padding: 12px 15px;

                font-size: 13px;

            }

        }


        /* =====================================
           VERY SMALL PHONES
        ====================================== */

        @media (max-width: 400px) {

            .clip-video-container iframe {

                height: 580px;

            }


            .clip-title {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <h1>
        🎬 BlockFlix
    </h1>


    <nav>

        <a href="index.html">
            Home
        </a>


        <a href="index.html#movies">
            Movies
        </a>


        <a href="index.html#trending">
            Trending
        </a>


        <a href="watchlist.html">
            ❤️ Watchlist
        </a>

    </nav>

</header>



<!-- =========================================
     CLIP PAGE
========================================= -->

<main>

    <section class="clip-page">


        <h2
            id="clipTitle"
            class="clip-title"
        >
            Loading Clip...
        </h2>


        <p
            id="clipInfo"
            class="clip-info"
        >
            Please wait...
        </p>



        <!-- =================================
             TIKTOK PLAYER
        ================================== -->

        <div
            id="clipVideoContainer"
            class="clip-video-container"
        >

            <div class="clip-loading">

                🎬 Loading TikTok video...

            </div>

        </div>



        <p
            id="clipMessage"
            class="clip-message"
        >
            Loading your clip...
        </p>



        <!-- =================================
             BUTTONS
        ================================== -->

        <div class="clip-buttons">


            <button
                id="landscapeButton"
                class="clip-button"
                type="button"
            >
                🔄 Watch Landscape
            </button>


            <button
                id="fullscreenButton"
                class="clip-button dark"
                type="button"
            >
                ⛶ Fullscreen
            </button>


            <a
                id="tiktokButton"
                href="#"
                class="clip-button dark"
                target="_blank"
                rel="noopener noreferrer"
            >
                ▶ Watch on TikTok
            </a>


            <a
                href="index.html#trending"
                class="clip-button dark"
            >
                ← Back to Trending
            </a>


        </div>


    </section>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <p>
        © 2026 BlockFlix
    </p>


    <p>
        Learning project
    </p>

</footer>



<!-- =========================================
     CLIP JAVASCRIPT
========================================= -->

<script>


/* =========================================
   CLIP DATABASE
========================================= */

const clips = {


    "7656446987218291999": {

        title: "Trending Edit",

        creator: "@flux.amvs",

        type: "🎬 Movie Edit",

        tiktok:
            "https://www.tiktok.com/@flux.amvs/video/7656446987218291999"

    },


    "7653207770488950037": {

        title: "Movie Edit",

        creator: "@blackoedits",

        type: "🎬 Cinematic Edit",

        tiktok:
            "https://www.tiktok.com/@blackoedits/video/7653207770488950037"

    },


    "7674280271902018824": {

        title: "Trending Clip",

        creator: "@yuipaws",

        type: "🔥 Popular Now",

        tiktok:
            "https://www.tiktok.com/@yuipaws/video/7674280271902018824"

    },


    "7661126710695349526": {

        title: "Movie Clip",

        creator: "@justcine_now",

        type: "🎥 Featured Clip",

        tiktok:
            "https://www.tiktok.com/@justcine_now/video/7661126710695349526"

    },


    "7665582138082823438": {

        title: "New Movie Edit",

        creator: "@reyfr33",

        type: "🔥 New Clip",

        tiktok:
            "https://www.tiktok.com/@reyfr33/video/7665582138082823438"

    },


    "7673548566408809735": {

        title: "Trending Movie Edit",

        creator: "@iamedemvictor_",

        type: "🔥 New Clip",

        tiktok:
            "https://www.tiktok.com/@iamedemvictor_/video/7673548566408809735"

    },


    "7658265014838578440": {

        title: "Movie Clip",

        creator: "@movie33kj",

        type: "🎬 New Clip",

        tiktok:
            "https://www.tiktok.com/@movie33kj/video/7658265014838578440"

    },


    "7663620156656012557": {

        title: "Action Edit",

        creator: "@byron_11jr",

        type: "🔥 Action Clip",

        tiktok:
            "https://www.tiktok.com/@byron_11jr/video/7663620156656012557"

    },


    "7661133288005848352": {

        title: "Movie Edit",

        creator: "@moviesmanofficial",

        type: "🎬 New Clip",

        tiktok:
            "https://www.tiktok.com/@moviesmanofficial/video/7661133288005848352"

    },


    "7665193118702112022": {

        title: "Best Movie Clip",

        creator: "@bestmovie2416",

        type: "🔥 New Clip",

        tiktok:
            "https://www.tiktok.com/@bestmovie2416/video/7665193118702112022"

    }

};



/* =========================================
   GET URL ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const clipId =
    params.get("id");


const clip =
    clips[clipId];



/* =========================================
   PAGE ELEMENTS
========================================= */

const title =
    document.getElementById(
        "clipTitle"
    );


const info =
    document.getElementById(
        "clipInfo"
    );


const container =
    document.getElementById(
        "clipVideoContainer"
    );


const message =
    document.getElementById(
        "clipMessage"
    );


const tiktokButton =
    document.getElementById(
        "tiktokButton"
    );


const landscapeButton =
    document.getElementById(
        "landscapeButton"
    );


const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );



/* =========================================
   CREATE TIKTOK PLAYER
========================================= */

let player = null;


function createTikTokPlayer() {

    if (!clip) {
        return;
    }


    player =
        document.createElement(
            "iframe"
        );


    player.src =
        "https://www.tiktok.com/player/v1/" +
        clipId +
        "?controls=1" +
        "&progress_bar=1" +
        "&play_button=1" +
        "&volume_control=1" +
        "&fullscreen_button=1" +
        "&timestamp=1" +
        "&description=0" +
        "&music_info=0" +
        "&rel=0";


    player.allow =
        "fullscreen";


    player.allowFullscreen =
        true;


    player.loading =
        "lazy";


    player.title =
        clip.title;


    player.setAttribute(
        "referrerpolicy",
        "strict-origin-when-cross-origin"
    );


    container.innerHTML = "";


    container.appendChild(
        player
    );

}



/* =========================================
   ENTER FULLSCREEN
========================================= */

async function enterFullscreen() {

    try {

        if (
            !document.fullscreenElement &&
            container.requestFullscreen
        ) {

            await container.requestFullscreen();

        } else if (
            !document.fullscreenElement &&
            container.webkitRequestFullscreen
        ) {

            container.webkitRequestFullscreen();

        }


        /*
         * Ask Android/browser to rotate
         * the screen to landscape.
         */

        if (
            screen.orientation &&
            screen.orientation.lock
        ) {

            try {

                await screen.orientation.lock(
                    "landscape"
                );

            } catch (orientationError) {

                console.log(
                    "Landscape orientation was not allowed:",
                    orientationError
                );

            }

        }

    } catch (error) {

        console.log(
            "Fullscreen error:",
            error
        );

        alert(
            "Your browser did not allow automatic landscape mode. Turn your phone sideways and use fullscreen."
        );

    }

}



/* =========================================
   LANDSCAPE BUTTON
========================================= */

if (landscapeButton) {

    landscapeButton.addEventListener(
        "click",
        function() {

            enterFullscreen();

        }
    );

}



/* =========================================
   FULLSCREEN BUTTON
========================================= */

if (fullscreenButton) {

    fullscreenButton.addEventListener(
        "click",
        function() {

            enterFullscreen();

        }
    );

}



/* =========================================
   EXIT FULLSCREEN
========================================= */

document.addEventListener(
    "fullscreenchange",
    async function() {

        if (!document.fullscreenElement) {

            if (
                screen.orientation &&
                screen.orientation.unlock
            ) {

                try {

                    screen.orientation.unlock();

                } catch (error) {

                    console.log(
                        "Orientation unlock failed:",
                        error
                    );

                }

            }

        }

    }
);



/* =========================================
   LOAD CLIP
========================================= */

if (!clip) {


    title.textContent =
        "Clip Not Found";


    info.textContent =
        "This clip does not exist.";


    container.innerHTML = `

        <div class="clip-loading">

            ❌ This clip could not be found.

        </div>

    `;


    message.textContent =
        "Please return to the Trending Clips section.";


    tiktokButton.style.display =
        "none";


    landscapeButton.style.display =
        "none";


    fullscreenButton.style.display =
        "none";


} else {


    title.textContent =
        clip.title;


    info.textContent =
        clip.type +
        " • " +
        clip.creator;


    tiktokButton.href =
        clip.tiktok;


    message.textContent =
        "Watch the clip directly on BlockFlix. " +
        "Use Watch Landscape for a larger viewing experience.";


    createTikTokPlayer();

}

</script>


</body>

</html>
